    <style>
        .sagas-page { padding-bottom: 4rem; }

        .sagas-hero {
          position: relative;

          border-bottom: 1px solid var(--border);
          background: var(--bg);
        }
        .sagas-hero-glow {
          position: absolute;
          border-radius: 50%;
          filter: blur(80px);
          pointer-events: none;
          opacity: 0.35;
          z-index: 0;
        }
        .sagas-hero-glow-one {
          width: 420px;
          height: 420px;
          background: var(--accent);

          height: 320px;
          background: #5c3d2e;
          bottom: -80px;
          right: 15%;

        .sagas-hero-inner {
          position: relative;
          z-index: 1;
          max-width: 720px;
          margin: 0 auto;
        }
        .sagas-hero .eyebrow {
          display: inline-flex;
          align-items: center;
          gap: 0.5rem;
          font-size: 0.8rem;
          font-weight: 600;
          letter-spacing: 0.14em;
          text-transform: uppercase;
          color: var(--accent);
          margin-bottom: 1.25rem;
        }
        .sagas-hero .eyebrow span {
          width: 8px;
          height: 8px;
          border-radius: 50%;
          background: var(--accent);
          box-shadow: 0 0 12px var(--accent);
        }
        .sagas-hero h1 {
          font-family: var(--font-display);
          font-size: clamp(2.4rem, 5.5vw, 3.4rem);
          font-weight: 700;
          line-height: 1.15;
          letter-spacing: -0.02em;
          margin: 0 0 1rem;
          color: var(--text);
        }
        .sagas-hero h1 em {
          font-style: italic;
          color: var(--accent);
        }
        .sagas-hero p {
          color: var(--text-muted);
          font-size: 1.05rem;
          line-height: 1.65;
          max-width: 540px;
          margin: 0 auto;
        }
        .sagas-hero p strong { color: var(--text); }

        .sagas-tabs {
          max-width: 1100px;
          margin: 1.75rem auto 1rem;
          padding: 0 1.25rem;
          display: flex;
          flex-wrap: wrap;
          gap: 0.5rem;
          justify-content: center;
        }
        .saga-tab {
          padding: 0.5rem 1rem;
          border-radius: 999px;
          border: 1px solid var(--border);
          background: var(--surface);
          color: var(--text-muted);
          font-size: 0.82rem;
          font-weight: 600;
          cursor: pointer;
          transition: all 0.2s;
        }
        .saga-tab:hover {
          border-color: var(--border-strong);
          color: var(--text);
        }
        .saga-tab.active {
          background: var(--accent);
          border-color: var(--accent);
          color: #1a1208;
        }

        .saga-meta {
          max-width: 720px;
          margin: 0 auto 1.5rem;
          padding: 0 1.25rem;
          text-align: center;
          color: var(--text-muted);
          font-size: 0.95rem;
          line-height: 1.6;
        }
        .saga-meta strong {
          color: var(--text);
          font-family: var(--font-display);
          font-size: 1.2rem;
          display: block;
          margin-bottom: 0.35rem;
        }

        .saga-timeline {
          max-width: 800px;
          margin: 0 auto;
          padding: 0 1.25rem;
          display: flex;
