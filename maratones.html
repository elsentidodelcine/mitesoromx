<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maratones | Los Brujos del Cine</title>
    <meta name="description" content="Maratones temáticos: 50 películas de terror para Halloween y más fechas del año.">
    <meta name="theme-color" content="#0a0508">
    <link rel="icon" href="imgs/logoLB.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="stylesLBDC.css">
    <link rel="stylesheet" href="maratones.css">
    <script>
        try {
          var t = localStorage.getItem('lbdc-theme');
          if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
    </script>
</head>
<body class="page-maratones">
<!-- Pega aquí tu mismo header del blog -->
<header class="site-header">
    <div class="header-inner">
        <a href="blog.html" class="brand-link">
            <img src="imgs/logoLB.png" alt="Los Brujos del Cine" class="site-logo">
            <div class="logo-text">
                <h1>Los Brujos del Cine</h1>
                <span>Mi Tesoro MX</span>
            </div>
        </a>
        <button type="button" class="nav-toggle" id="nav-toggle" aria-expanded="false" aria-label="Abrir menú">
            <span></span><span></span><span></span>
        </button>
        <nav class="main-nav" id="main-nav" aria-label="Navegación principal">
            <a href="blog.html#resenas">Reseñas</a>
            <a href="estrenos.html">Estrenos</a>
            <a href="maratones.html">Maratones</a>
            <a href="sagas.html">Sagas</a>
            <a href="taquilla-historia.html">Taquilla</a>
            <a href="precios.html">Precios</a>
            <a href="formatos.html">Formatos</a>
        </nav>
        <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Cambiar tema">☾</button>
    </div>
</header>

<main class="maratones-page">
    <section class="maraton-hero" id="maraton-hero">
        <div class="maraton-hero-inner">
            <div class="eyebrow" id="maraton-eyebrow">🎃 Temporada de sustos</div>
            <h1 id="maraton-titulo">Maratones</h1>
            <p id="maraton-desc"></p>
            <p class="maraton-countdown" id="maraton-countdown" hidden></p>
        </div>
    </section>

    <div class="maraton-tabs" id="maraton-tabs" role="tablist"></div>

    <!-- Sticky filters -->
    <div class="maraton-filters-sticky" id="maraton-filters">
        <div class="maraton-filters-inner">
            <div class="maraton-count" id="maraton-count"></div>
            <div class="maraton-filters-row">
                <label>
                    Subgénero
                    <select id="filtro-subgenero"><option value="todos">Todos</option></select>
                </label>
                <label>
                    Intensidad
                    <select id="filtro-intensidad">
                        <option value="todos">Todas</option>
                        <option value="suave">Suave</option>
                        <option value="medio">Media</option>
                        <option value="extremo">Extrema</option>
                    </select>
                </label>
                <label>
                    Década
                    <select id="filtro-decada"><option value="todos">Todas</option></select>
                </label>
                <label class="check-label">
                    <input type="checkbox" id="filtro-resena"> Solo con reseña
                </label>
                <button type="button" class="btn-ghost" id="btn-random">🎲 Sorpréndeme</button>
                <button type="button" class="btn-ghost" id="btn-copiar-lista">📋 Copiar lista</button>
                <button type="button" class="btn-ghost" id="btn-reshuffle">🔀 Mezclar</button>
            </div>
        </div>
    </div>

    <!-- Empieza aquí -->
    <section class="maraton-empieza" id="maraton-empieza" hidden>
        <h2>Empieza por estas</h2>
        <div class="maraton-empieza-grid" id="maraton-empieza-grid"></div>
    </section>

    <!-- Noches -->
    <section class="maraton-noches" id="maraton-noches" hidden></section>

    <!-- Parejas -->
    <section class="maraton-parejas" id="maraton-parejas" hidden>
        <h2>Si te gustó… sigue con</h2>
        <div class="maraton-parejas-list" id="maraton-parejas-list"></div>
    </section>

    <h2 class="maraton-grid-title" id="maraton-grid-title">Todas las películas</h2>
    <div class="maraton-grid" id="maraton-grid" aria-live="polite">
        <!-- skeleton -->
    </div>
    <div class="maraton-empty" id="maraton-empty" hidden>
        <p>No hay películas con estos filtros.</p>
        <button type="button" class="btn-ghost" id="btn-limpiar-filtros">Limpiar filtros</button>
    </div>


</main>

<button type="button" id="btn-top" class="btn-top btn-top--pumpkin" aria-label="Volver arriba">🎃</button>

<footer class="site-footer">
    <div class="footer-inner">
        <div class="footer-links">
            <a href="aviso-de-privacidad-LBDC.html">Política de Privacidad</a>
            <a href="https://losbrujosdelcine.com/#catalogo" target="_blank" rel="noopener">Mi Tesoro MX</a>
        </div>
        <div class="footer-copy"><p>© 2026 Los Brujos del Cine</p></div>
    </div>
</footer>

<button type="button" id="btn-top" class="btn-top" aria-label="Volver arriba">↑</button>
<script src="maratones.js"></script>
</body>
</html>
