    <style>
        .review-page { padding-bottom: 5rem; }

        .review-hero {
          position: relative;
          padding: 2.75rem 0 3.25rem;
          border-bottom: 1px solid var(--border);
          overflow: hidden;
        }
        .review-hero-glow {
          position: absolute;
          border-radius: 50%;
          filter: blur(80px);
          pointer-events: none;
          opacity: 0.3;
          z-index: 0;
        }
        .review-hero-glow-one {
          width: 420px;
          height: 420px;
          background: var(--accent);
          top: -140px;
          left: 40%;
        }
        .review-hero-glow-two {
          width: 280px;
          height: 280px;
          background: #5c3d2e;
          bottom: -60px;
          right: 10%;
        }
        .review-hero-inner {
          position: relative;
          z-index: 1;
          max-width: 1100px;
          margin: 0 auto;
          padding: 0 1.25rem;
        }

        .back-link {
          display: inline-flex;
          align-items: center;
          gap: 0.5rem;
          margin-bottom: 1.75rem;
          color: var(--text-muted);
          font-size: 0.85rem;
          font-weight: 500;
          transition: color 0.2s, gap 0.2s;
        }
        .back-link:hover {
          color: var(--accent);
          gap: 0.75rem;
        }

        .review-header {
          display: grid;
          grid-template-columns: 240px 1fr;
          gap: 2.5rem;
          align-items: start;
        }

        .review-poster {
          border-radius: var(--radius);
          overflow: hidden;
          border: 1px solid var(--border);
          background: var(--surface);
          box-shadow: var(--shadow);
        }
        .review-poster img {
          width: 100%;
          aspect-ratio: 2 / 3;
          object-fit: cover;
          display: block;
        }
        .poster-placeholder {
          min-height: 320px;
          display: flex;
          align-items: center;
          justify-content: center;
          color: var(--text-faint);
          font-size: 0.85rem;
        }

        .review-info h1 {
          font-family: var(--font-display);
          font-size: clamp(2rem, 4.5vw, 3rem);
          font-weight: 700;
          line-height: 1.1;
          letter-spacing: -0.02em;
          margin: 0 0 0.85rem;
          color: var(--text);
        }

        .review-meta {
          display: flex;
          flex-wrap: wrap;
          align-items: center;
          gap: 0.5rem 0.75rem;
          margin-bottom: 1.25rem;
          color: var(--text-muted);
          font-size: 0.85rem;
          font-weight: 500;
        }
        .review-meta .dot {
          width: 3px;
          height: 3px;
          border-radius: 50%;
          background: var(--accent);
          display: inline-block;
        }

        .grimorio-rating {
          display: flex;
          flex-direction: column;
          gap: 0.55rem;
          margin-bottom: 1.35rem;
          padding: 1.1rem 1.2rem;
          border-radius: var(--radius);
          background: var(--accent-soft);
          border: 1px solid var(--border);
          position: relative;
          overflow: hidden;
        }
        .grimorio-rating::before {
          content: "";
          position: absolute;
          top: 0; left: 0;
          width: 4px;
          height: 100%;
          background: linear-gradient(to bottom, var(--accent), #8a6b1a);
        }
        .grimorio-top {
          display: flex;
          align-items: center;
          gap: 0.85rem;
          flex-wrap: wrap;
        }
        .grimorio-score {
          font-family: var(--font-display);
          font-size: 2rem;
          font-weight: 700;
          color: var(--accent);
          line-height: 1;
        }
        .grimorio-score small {
          font-size: 0.95rem;
          font-weight: 600;
          color: var(--text-faint);
        }
        .grimorio-stars {
          display: flex;
          gap: 2px;
          font-size: 1.2rem;
          color: var(--accent);
        }
        .grimorio-stars .empty { color: var(--text-faint); opacity: 0.35; }
        .grimorio-stars .half {
          position: relative;
          color: var(--text-faint);
          opacity: 0.35;
        }
        .grimorio-stars .half::after {
          content: "★";
          position: absolute;
          left: 0; top: 0;
          width: 50%;
          overflow: hidden;
          color: var(--accent);
          opacity: 1;
        }
        .grimorio-title {
          font-family: var(--font-display);
          font-size: 1.1rem;
          font-weight: 700;
          color: var(--text);
        }
        .grimorio-desc {
          font-size: 0.9rem;
          line-height: 1.55;
          color: var(--text-muted);
          margin: 0;
          max-width: 520px;
        }

        .review-platforms {
          display: flex;
          flex-wrap: wrap;
          gap: 0.45rem;
          margin-bottom: 1.25rem;
        }
        .platform-tag {
          padding: 0.3rem 0.75rem;
          border-radius: 999px;
          background: var(--surface);
          border: 1px solid var(--border);
          font-size: 0.68rem;
          font-weight: 600;
          letter-spacing: 0.04em;
          text-transform: uppercase;
          color: var(--text-muted);
        }

        .review-actions {
          display: flex;
          flex-wrap: wrap;
          gap: 0.55rem;
          align-items: center;
        }
        .btn-imdb,
        .btn-letterboxd,
        .btn-share-wa,
        .btn-copy-link {
          display: inline-flex;
          align-items: center;
          justify-content: center;
          gap: 0.45rem;
          min-height: 42px;
          padding: 0.55rem 1rem;
          border-radius: 999px;
          font-size: 0.8rem;
          font-weight: 600;
          text-decoration: none;
          border: 1px solid transparent;
          cursor: pointer;
          transition: all 0.2s ease;
          white-space: nowrap;
          color: inherit;
          background: transparent;
          font-family: inherit;
        }
        .btn-imdb {
          background: rgba(245, 197, 24, 0.12);
          border-color: rgba(245, 197, 24, 0.4);
          color: #f5c518;
        }
        .btn-imdb:hover { background: rgba(245, 197, 24, 0.2); }
        .btn-letterboxd {
          background: var(--surface);
          border-color: var(--border);
          color: var(--text);
        }
        .btn-letterboxd:hover {
          border-color: #00e054;
          color: #00e054;
        }
        .btn-share-wa {
          background: rgba(37, 211, 102, 0.12);
          border-color: rgba(37, 211, 102, 0.35);
          color: #3ddc81;
        }
        .btn-share-wa:hover { background: rgba(37, 211, 102, 0.2); }
        .btn-copy-link {
          background: var(--surface);
          border-color: var(--border);
          color: var(--text-muted);
        }
        .btn-copy-link:hover {
          border-color: var(--accent);
          color: var(--accent);
        }

        .review-body {
          max-width: 720px;
          margin: 3.5rem auto 0;
          padding: 0 1.25rem;
        }
        .review-body .lead {
          font-family: var(--font-display);
          font-size: 1.3rem;
          line-height: 1.5;
          color: var(--text);
          margin-bottom: 2rem;
          font-weight: 600;
        }
        .review-body p {
          color: var(--text-muted);
          font-size: 1.05rem;
          line-height: 1.8;
          margin: 0 0 1.4rem;
        }
        .review-body blockquote {
          margin: 2rem 0;
          padding: 1.1rem 1.35rem;
          border-left: 3px solid var(--accent);
          background: var(--accent-soft);
          border-radius: 0 12px 12px 0;
          font-family: var(--font-display);
          font-size: 1.15rem;
          font-style: italic;
          color: var(--text);
          line-height: 1.5;
        }

        .verdict {
          margin-top: 2.75rem;
          padding: 1.5rem 1.6rem;
          border-radius: var(--radius);
          background: var(--surface);
          border: 1px solid var(--border);
        }
        .verdict-header {
          display: flex;
          align-items: center;
          gap: 0.5rem;
          margin-bottom: 0.65rem;
          font-family: var(--font-display);
          font-size: 1.2rem;
          color: var(--text);
        }
        .verdict-header span { color: var(--accent); }
        .verdict p {
          color: var(--text-muted);
          font-size: 1.02rem;
          line-height: 1.7;
          margin: 0;
        }

        .donde-barato {
          max-width: 720px;
          margin: 2rem auto 0;
          padding: 1.1rem 1.25rem;
          border-radius: var(--radius);
          border: 1px solid color-mix(in srgb, var(--accent) 25%, var(--border));
          background: var(--accent-soft);
        }
        .donde-barato h3 {
          font-family: var(--font-display);
          color: var(--text);
          font-size: 1.1rem;
          margin: 0 0 0.4rem;
        }
        .donde-barato p {
          margin: 0;
          color: var(--text-muted);
          font-size: 0.92rem;
          line-height: 1.55;
        }
        .donde-barato a {
          color: var(--accent);
          text-decoration: underline;
          text-underline-offset: 3px;
        }

        .related-reviews {
          max-width: 1100px;
          margin: 2.75rem auto 0;
          padding: 0 1.25rem;
        }
        .related-reviews h3 {
          font-family: var(--font-display);
          color: var(--text);
          font-size: 1.3rem;
          margin: 0 0 1rem;
          text-align: center;
        }
        .related-grid {
          display: grid;
          grid-template-columns: repeat(3, 1fr);
          gap: 0.85rem;
        }
        .related-card {
          display: flex;
          flex-direction: column;
          gap: 0.45rem;
          padding: 0.75rem;
          border-radius: 12px;
          border: 1px solid var(--border);
          background: var(--surface);
          text-decoration: none;
          color: var(--text);
          transition: border-color 0.2s, transform 0.15s;
        }
        .related-card:hover {
          border-color: var(--accent);
          transform: translateY(-2px);
        }
        .related-card img {
          width: 100%;
          aspect-ratio: 2 / 3;
          object-fit: cover;
          border-radius: 8px;
          background: var(--bg-elevated);
        }
        .related-title {
          font-weight: 700;
          font-size: 0.88rem;
          line-height: 1.3;
        }
        .related-card small {
          color: var(--accent);
          font-weight: 700;
        }

        .review-nav {
          max-width: 1100px;
          margin: 3.5rem auto 0;
          padding: 0 1.25rem;
          display: flex;
          justify-content: space-between;
          gap: 1rem;
          flex-wrap: wrap;
        }
        .review-nav a {
          flex: 1;
          min-width: 160px;
          max-width: 320px;
          padding: 1rem 1.15rem;
          border-radius: 12px;
          background: var(--surface);
          border: 1px solid var(--border);
          transition: all 0.2s;
          text-decoration: none;
          color: inherit;
        }
        .review-nav a:hover {
          border-color: var(--accent);
          transform: translateY(-2px);
        }
        .review-nav .label {
          display: block;
          font-size: 0.65rem;
          font-weight: 700;
          letter-spacing: 0.12em;
          text-transform: uppercase;
          color: var(--text-faint);
          margin-bottom: 0.35rem;
        }
        .review-nav .title {
          font-family: var(--font-display);
          font-size: 1.05rem;
          color: var(--text);
          font-weight: 600;
        }
        .review-nav a:last-child {
          text-align: right;
          margin-left: auto;
        }

        .loading-state,
        .error-state {
          text-align: center;
          padding: 6rem 1.25rem;
          color: var(--text-muted);
          font-size: 1.05rem;
        }
        .error-state a {
          color: var(--accent);
          text-decoration: underline;
        }

        @media (max-width: 800px) {
          .review-header {
            grid-template-columns: 1fr;
            gap: 1.5rem;
            text-align: center;
          }
          .review-poster {
            max-width: 220px;
            margin: 0 auto;
          }
          .review-meta,
          .review-platforms,
          .review-actions {
            justify-content: center;
          }
          .grimorio-top { justify-content: center; }
          .grimorio-desc {
            text-align: center;
            margin-left: auto;
            margin-right: auto;
          }
          .related-grid {
            grid-template-columns: 1fr 1fr;
          }
          .review-nav { flex-direction: column; }
          .review-nav a:last-child {
            text-align: left;
            margin-left: 0;
          }
        }
        @media (max-width: 480px) {
          .review-actions { flex-direction: column; align-items: stretch; }
          .btn-imdb, .btn-letterboxd, .btn-share-wa, .btn-copy-link { width: 100%; }
          .related-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
