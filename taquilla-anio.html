    <style>
            .taquilla-page { padding-bottom: 4rem; }

            .taquilla-hero {
              position: relative;
              padding: 5rem 1.5rem 3.25rem;
              text-align: center;
              border-bottom: 1px solid var(--border);
              overflow: hidden;
              background: var(--bg);
            }
            .taquilla-hero-glow {
              position: absolute;
              border-radius: 50%;
              filter: blur(80px);
              pointer-events: none;
              opacity: 0.35;
              z-index: 0;
            }
            .taquilla-hero-glow-one {
              width: 420px; height: 420px;
              background: var(--accent);
              top: -120px; left: 50%;
              transform: translateX(-55%);
            }
            .taquilla-hero-glow-two {
              width: 300px; height: 300px;
              background: #5c3d2e;
              bottom: -80px; right: 12%;
            }
            .taquilla-hero-inner {
              position: relative; z-index: 1;
              max-width: 640px; margin: 0 auto;
            }
            .taquilla-hero .eyebrow {
              display: inline-flex; align-items: center; gap: 0.5rem;
              font-size: 0.8rem; font-weight: 600;
              letter-spacing: 0.14em; text-transform: uppercase;
              color: var(--accent); margin-bottom: 1rem;
            }
            .taquilla-hero .eyebrow span {
              width: 8px; height: 8px; border-radius: 50%;
              background: var(--accent); box-shadow: 0 0 12px var(--accent);
            }
            .taquilla-hero h1 {
              font-family: var(--font-display);
              font-size: clamp(2.2rem, 5vw, 3.2rem);
              font-weight: 700; letter-spacing: -0.02em;
              margin: 0 0 0.85rem; color: var(--text);
            }
            .taquilla-hero h1 em { color: var(--accent); font-style: italic; }
            .taquilla-hero p {
              color: var(--text-muted); font-size: 1.02rem; line-height: 1.65; margin: 0;
            }

            .taquilla-tabs {
              max-width: 900px; margin: 1.75rem auto 1.25rem;
              padding: 0 1.25rem;
              display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center;
            }
            .taquilla-tabs a {
              padding: 0.5rem 1.05rem; border-radius: 999px;
              border: 1px solid var(--border); background: var(--surface);
              color: var(--text-muted); font-size: 0.8rem; font-weight: 600;
              text-decoration: none; transition: all 0.2s;
            }
            .taquilla-tabs a:hover { color: var(--text); border-color: var(--border-strong); }
            .taquilla-tabs a.active {
              background: var(--accent); border-color: var(--accent);
              color: #1a1208; box-shadow: 0 4px 14px rgba(212, 175, 55, 0.25);
            }

            .year-select-wrap {
              max-width: 900px; margin: 0 auto 1.5rem; padding: 0 1.25rem;
              display: flex; flex-wrap: wrap; justify-content: center;
              align-items: center; gap: 0.75rem 1rem;
            }
            .year-select-wrap label {
              font-size: 0.78rem; color: var(--text-muted); font-weight: 600;
            }
            .year-select-wrap select {
              min-height: 42px; min-width: 120px;
              padding: 0.45rem 1rem; border-radius: 999px;
              border: 1px solid var(--border); background: var(--surface);
              color: var(--text); font-size: 0.85rem; cursor: pointer;
            }
            .year-select-wrap select:hover,
            .year-select-wrap select:focus { border-color: var(--accent); outline: none; }

            .taquilla-note, .taquilla-count {
              max-width: 900px; margin: 0.5rem auto; padding: 0 1.25rem;
              text-align: center; font-size: 0.82rem; color: var(--text-faint);
            }

            .taquilla-list {
              max-width: 900px; margin: 0 auto; padding: 0 1.25rem;
              display: flex; flex-direction: column; gap: 0.75rem;
              animation: fadeIn 0.3s ease;
            }
            @keyframes fadeIn {
              from { opacity: 0; transform: translateY(8px); }
              to { opacity: 1; transform: translateY(0); }
            }

            .taquilla-row {
              display: flex; flex-direction: row; align-items: center;
              gap: 1rem; padding: 0.9rem 1rem;
              border-radius: 14px; border: 1px solid var(--border);
              background: var(--surface); color: var(--text);
              transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
            }
            .taquilla-row:hover {
              transform: translateY(-2px);
              border-color: color-mix(in srgb, var(--accent) 40%, var(--border));
              box-shadow: var(--shadow);
            }
            .taquilla-row.top-1 {
              border-color: color-mix(in srgb, var(--accent) 55%, var(--border));
              background: linear-gradient(135deg, var(--accent-soft), transparent);
            }
            .taquilla-row.top-2 { border-color: rgba(180, 180, 190, 0.4); }
            .taquilla-row.top-3 { border-color: rgba(205, 127, 50, 0.4); }

            .taquilla-pos {
              flex: 0 0 36px; text-align: center;
              font-family: var(--font-display); font-weight: 800;
              font-size: 1.3rem; color: var(--accent);
            }
            .taquilla-pos.top3 { font-size: 1.45rem; }

            .taquilla-poster {
              flex: 0 0 64px; width: 64px; height: 96px;
              object-fit: cover; border-radius: 8px;
              background: var(--bg-elevated); opacity: 0;
              transition: opacity 0.35s;
            }
            .taquilla-poster.loaded { opacity: 1; }

            .taquilla-info { flex: 1 1 auto; min-width: 0; }
            .taquilla-info strong {
              display: block; font-size: 0.95rem; margin-bottom: 0.25rem;
              white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
              color: var(--text);
            }
            .taquilla-info > span { font-size: 0.75rem; color: var(--text-faint); }

            .taquilla-money {
              flex: 0 0 auto; margin-left: auto;
              font-family: var(--font-display); font-size: 1.1rem;
              font-weight: 800; color: var(--accent); white-space: nowrap;
            }
            .taquilla-row--anio { align-items: flex-start; }
            .taquilla-row--anio .taquilla-money { display: none; }

            .badge-resultado, .badge-cartel {
              display: inline-block; margin-left: 0.4rem;
              padding: 0.2rem 0.55rem; border-radius: 999px;
              font-size: 0.62rem; font-weight: 700; text-transform: uppercase;
              letter-spacing: 0.04em;
            }
            .badge-perdida {
              background: rgba(196, 92, 74, 0.15); color: #ff8a9a;
              border: 1px solid rgba(196, 92, 74, 0.35);
            }
            .badge-rentable {
              background: var(--accent-soft); color: var(--accent);
              border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
            }
            .badge-exito {
              background: rgba(125, 222, 160, 0.12); color: #7ddea0;
              border: 1px solid rgba(125, 222, 160, 0.3);
            }
            .badge-sin-dato {
              background: var(--surface); color: var(--text-faint);
              border: 1px solid var(--border);
            }
            .badge-cartel {
              background: rgba(196, 92, 74, 0.18); color: #ff8a9a;
              border: 1px solid rgba(196, 92, 74, 0.4);
            }

            .taquilla-figures {
              display: flex; flex-wrap: wrap; gap: 0.45rem 0.85rem;
              margin-top: 0.35rem; font-size: 0.78rem; color: var(--text-faint);
            }
            .taquilla-figures b { color: var(--text); font-weight: 700; }

            .bar-wrap { margin-top: 0.85rem; width: 100%; }
            .bar-wrap--empty { font-size: 0.75rem; color: var(--text-faint); }
            .bar-labels { position: relative; height: 18px; margin-bottom: 4px; }
            .bar-label {
              position: absolute; transform: translateX(-50%);
              font-size: 0.6rem; font-weight: 700; white-space: nowrap; pointer-events: none;
            }
            .bar-label--budget { color: var(--text-faint); }
            .bar-label--rentable { color: var(--accent); }
            .bar-label--exito { color: #7ddea0; }
            .bar-label--now {
              color: #fff; background: rgba(0,0,0,0.55);
              padding: 2px 6px; border-radius: 999px; top: -2px;
            }
            .bar-track {
              position: relative; height: 12px; border-radius: 999px;
              background: rgba(255,255,255,0.08); border: 1px solid var(--border);
            }
            .bar-fill {
              position: absolute; left: 0; top: 0; bottom: 0;
              border-radius: 999px; z-index: 1;
            }
            .bar-fill--exito { background: linear-gradient(90deg, #1e6b42, #3ecf7a); }
            .bar-fill--rentable { background: linear-gradient(90deg, #8a7019, var(--accent)); }
            .bar-fill--perdida { background: linear-gradient(90deg, #9a1830, #e85a6b); }
            .bar-mark {
              position: absolute; top: -3px; bottom: -3px; width: 2px;
              transform: translateX(-50%); border-radius: 2px; z-index: 3;
            }
            .bar-mark--budget { background: var(--text-muted); }
            .bar-mark--rentable { background: var(--accent); }
            .bar-mark--exito { background: #b8f5d0; }

            .year-block { margin-bottom: 2rem; }
            .year-block h2 {
              max-width: 900px; margin: 0 auto 0.85rem; padding: 0 1.25rem 0.5rem;
              font-family: var(--font-display); font-size: 1.4rem;
              color: var(--text); border-bottom: 1px solid var(--border);
            }

            .empty-state, .loading-state {
              text-align: center; padding: 3rem 1.25rem; color: var(--text-muted);
            }
            .skeleton-list {
              display: flex; flex-direction: column; gap: 0.75rem;
              max-width: 900px; margin: 0 auto; padding: 0 1.25rem;
            }
            .skeleton-row {
              height: 100px; border-radius: 14px; border: 1px solid var(--border);
              background: linear-gradient(90deg, var(--bg-elevated) 25%, var(--surface-hover) 50%, var(--bg-elevated) 75%);
              background-size: 200% 100%;
              animation: skeleton-shine 1.4s ease-in-out infinite;
            }
            @keyframes skeleton-shine {
              0% { background-position: 200% 0; }
              100% { background-position: -200% 0; }
            }

            [data-theme="light"] .bar-track {
              background: rgba(0,0,0,0.06); border-color: rgba(0,0,0,0.1);
            }
            [data-theme="light"] .bar-label--now {
              background: rgba(0,0,0,0.8); color: #fff;
            }

            @media (max-width: 600px) {
              .taquilla-row { gap: 0.75rem; padding: 0.75rem; }
              .taquilla-pos { flex-basis: 28px; font-size: 1.1rem; }
              .taquilla-poster { flex-basis: 52px; width: 52px; height: 78px; }
              .taquilla-info strong {
                white-space: normal;
                display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
                overflow: hidden; line-height: 1.25;
              }
              .year-select-wrap { flex-direction: column; align-items: stretch; }
              .year-select-wrap select { width: 100%; }
              .bar-label--rentable, .bar-label--exito { display: none; }
            }
    </style>
    <script>
        try {
          var t = localStorage.getItem('lbdc-theme');
          if (t === 'light' || t === 'dark') {
            document.documentElement.setAttribute('data-theme', t);
          }
        } catch (e) {}
    </script>
